  - "Tratar a não sobreposição de vigência separadamente e validar btree_gist antes de propor EXCLUDE USING gist."
  - "Criar índices candidatos para as 59 FKs, além das colunas usadas por escopos RLS, e validar os planos de consulta na etapa física."
  - "Não inferir nem fabricar placares históricos ausentes; os registros afetados permanecem fora da carga."
  - "Atribuições de papel devem possuir vigência, responsável, auditoria e proibição de autoatribuição."
  - "A revisão de scout deve impedir que o analista autor revise a própria observação."
  - "Somente os 9 recursos PUBLICO podem ser candidatos à Data API; os demais 23 permanecem fechados até revisão explícita."
