evidence_refs:
  - id: "EVID_IHF_SPIN_SHOT_CRITERIA"
    source_id: "SRC_IHF_SPIN_INFLIGHT_2023"
    locator: "Slides 11-35"
    evidence_type: "REGRA"
    excerpt: "Spin shot: A shot taken with full turn of the body in the air. Correct ('complete') spin shot - when the jumping feet of the player are pointing directly towards the goal at the point of take-off."
    interpretation: "Gols de Spin Shot valem 2 pontos apenas quando executados com giro completo de 360 graus do corpo no ar e com os pés da atleta apontando diretamente para o gol no momento do salto."

  - id: "EVID_IHF_INFLIGHT_CONTROL"
    source_id: "SRC_IHF_SPIN_INFLIGHT_2023"
    locator: "Slides 36-43"
    evidence_type: "REGRA"
    excerpt: "Two points are awarded only if the player who is in-flight controls the ball and shoots at goal while in the air. 'Slapping' the ball or just 'pushing' the ball into the goal is worth one point."
    interpretation: "Gols em ponte aérea (in-flight) valem 2 pontos apenas quando a atleta no ar domina e controla a bola antes do arremesso. Empurrar ou dar um tapa na bola diretamente para o gol no ar vale apenas 1 ponto."

  - id: "EVID_IHF_6M_THROW_SCORING"
    source_id: "SRC_IHF_SPIN_INFLIGHT_2023"
    locator: "Slides 44-47; SRC_IHF_6M_PUNISHMENTS_2023 Slides 03-09"
    evidence_type: "REGRA"
    excerpt: "A goal scored by a 6-metre throw is awarded with two points. A clear chance of scoring is destroyed anywhere on the court by a player or a team official of the opposing team."
    interpretation: "Gols decorrentes de Tiro de 6 Metros concedidos após a destruição de uma chance clara de gol valem obrigatoriamente 2 pontos."

  - id: "EVID_IHF_GOALKEEPER_SPECIALIST_GOAL"
    source_id: "SRC_IHF_SPIN_INFLIGHT_2023"
    locator: "Slides 48-51"
    evidence_type: "REGRA"
    excerpt: "Every goal made by a goalkeeper or specialist is awarded two points. They wear differently coloured shirts."
    interpretation: "Qualquer gol assinalado diretamente pela Goleira (arremessando de sua própria área) ou pela Especialista (vestindo uniforme de cor diferenciada) vale 2 pontos."

  - id: "EVID_IHF_ENGLISH_PREVALENCE"
    source_id: "SRC_IHF_RULES_2026_EN"
    locator: "IHF Rules 2026 - Preâmbulo e Disposições Gerais"
    evidence_type: "REGRA"
    excerpt: "The official text of the IHF Beach Handball Rules of the Game is published in English. In case of divergence between translations and the English text, the English version shall prevail."
    interpretation: "O texto oficial em língua inglesa possui prevalência hierárquica e normativa absoluta sobre qualquer tradução ou versão regional em português em caso de dúvida conceitual ou divergência terminológica."

  - id: "EVID_FHERJ_STALE_SCORING_RULE"
    source_id: "SRC_MODELO_CONCEITUAL_04A"
    locator: "Seção 4, SGATE-0023; 04B Seção 3.25"
    evidence_type: "DECISAO"
    excerpt: "A pontuação FHERJ 2026 está governada por SGATE-0023: posições 1..7 validadas em 16/13/11/10/9/8/7; o Art. 25º armazenado está STALE_FOR_SCORING e valores não verificados não podem ser inferidos."
    interpretation: "O Art. 25º do regulamento FHERJ antigo encontra-se obsoleto para atribuição de pontos por etapa (STALE_FOR_SCORING), prevalecendo a tabela oficial homologada pelo SGATE-0023 para as posições de 1º a 7º lugar (16, 13, 11, 10, 9, 8 e 7 pontos)."

  - id: "EVID_SGATE_0024_CAMPINAS_EXCEPTION"
    source_id: "SRC_MODELO_CONCEITUAL_04A"
    locator: "Seção 9, SGATE-0024; 04B Seção 10.6"
    evidence_type: "DECISAO"
    excerpt: "Campinas/SP participa e é classificada normalmente em cada etapa, recebe e acumula pontos normalmente, mas após a última etapa é excluída do FINAL_CIRCUIT_STANDING por ser equipe convidada/fora do estado."
    interpretation: "Equipes convidadas de outros estados (como Campinas/SP no Circuito Carioca 2026) acumulam pontos e classificam-se em etapas normais, mas possuem elegibilidade contextual (INELIGIBLE_BY_EXCEPTION) que as exclui da classificação final do circuito sem alterar o histórico factual."

  - id: "EVID_CEPRAEA_GOALKEEPER_POSITION"
    source_id: "SRC_CEPRAEA_DATABASE"
    locator: "Aba DB_CONFIG, chave goalkeeper_semantics; 04A Seção 6"
    evidence_type: "DECISAO"
    excerpt: "goalkeeper_semantics: GOLEIRA_IS_POSITION_UNDER_DEFESA: Decisão humana 2026-08-10: GOLEIRA é posição, não função; pertence à função DEFESA. GOLEIRA não pode ser reintroduzida como FUNÇÃO da taxonomia TACT V2."
    interpretation: "A Goleira é estritamente uma posição tática integrada à macrofunção defensiva (DEFESA) no sistema de dados, e não uma função isolada ou independente na taxonomia do esporte."

  - id: "EVID_HISTORICAL_BASELINE_STOP_GATE"
    source_id: "SRC_CEPRAEA_DATABASE"
    locator: "Aba DB_CONFIG, chave sql_stop_gate; 04B Seção 7; 05 Seção 0"
    evidence_type: "DECISAO"
    excerpt: "sql_stop_gate: FECHADO. Nenhum SQL, migração, RLS ou banco físico foi gerado nesta execução."
    interpretation: "Os artefatos 04A a 07 configuram um baseline histórico de reconciliação de dados, mantendo o STOP GATE físico trancado e fechado (sql_stop_gate: FECHADO), impedindo qualquer execução de DDL ou alteração de banco no ambiente corrente sem nova ordem expressa."

precedence_rules:
  - id: "PREC_IHF_EN_OVER_PT"
    higher_authority_source_id: "SRC_IHF_RULES_2026_EN"
    lower_authority_source_id: "SRC_IHF_RULES_2026_PT"
    scope: "Regras do jogo, terminologia tática, mecânica de arbitragem e pontuação de finalizações."
    rationale: "O regulamento internacional da IHF estabelece que o texto original publicado em inglês prevalece soberanamente sobre qualquer tradução ou adaptação nacional."
    evidence_ref_ids:
      - "EVID_IHF_ENGLISH_PREVALENCE"

  - id: "PREC_NORMATIVE_OVER_OPERATIONAL"
    higher_authority_source_id: "SRC_IHF_RULES_2026_EN"
    lower_authority_source_id: "SRC_PROTOCOLO_SCOUT"
    scope: "Definição do esporte, valor de gols, penalidades disciplinares e critérios de validação de jogadas em geral."
    rationale: "As regras formais da entidade internacional da modalidade superam diretrizes operacionais internas de scout e o banco de dados local CEPRAEA DATABASE em qualquer divergência de conceito ou regra do jogo."
    evidence_ref_ids:
      - "EVID_IHF_SPIN_SHOT_CRITERIA"
      - "EVID_IHF_INFLIGHT_CONTROL"
      - "EVID_IHF_6M_THROW_SCORING"
      - "EVID_IHF_GOALKEEPER_SPECIALIST_GOAL"

  - id: "PREC_OPERATIONAL_SCORING_OVER_STALE_FHERJ"
    higher_authority_source_id: "SRC_CEPRAEA_DATABASE"
    lower_authority_source_id: "SRC_REGULAMENTO_FHERJ_2026"
    scope: "Pontuação por etapa e ranking do Circuito Carioca de Handebol de Praia 2026."
    rationale: "Decisões operacionais homologadas e publicadas posteriormente (SGATE-0023 e SGATE-0024) prevalecem sobre a redação obsoleta e desatualizada do Art. 25º da cópia impressa do regulamento estadual."
    evidence_ref_ids:
      - "EVID_FHERJ_STALE_SCORING_RULE"
      - "EVID_SGATE_0024_CAMPINAS_EXCEPTION"

  - id: "PREC_EXECUTION_CONTROL_OVER_HISTORICAL"
    higher_authority_source_id: "SRC_CTRL_FLUXO_MODELAGEM"
    lower_authority_source_id: "SRC_MODELO_CONCEITUAL_04A"
    scope: "Status de aprovação, estado de execução e permissão de modificação física no ambiente atual."
    rationale: "As diretrizes fixadas na execução corrente redefinem obrigatoriamente o estado do documento para PROPOSTO e mantêm o STOP GATE fechado, sobrepondo-se a estados históricos de 'APPROVED' contidos no texto de propostas passadas."
    evidence_ref_ids:
      - "EVID_HISTORICAL_BASELINE_STOP_GATE"

conflicts:
  - id: "CONF_STATUS_ALLEGED_VS_EXECUTION"
    status: "DECISAO_HUMANA_PENDENTE"
    subject_id: "REGISTRATION_STATUS_AND_EXECUTION_GATE"
    source_ids:
      - "SRC_MODELO_CONCEITUAL_04A"
      - "SRC_MODELO_LOGICO_04B"
      - "SRC_POSTGRESQL_SCHEMA_05"
      - "SRC_CTRL_FLUXO_MODELAGEM"
    description: "Propostas históricas (04A, 04B e 05) trazem internamente o cabeçalho 'Estado: APPROVED', contudo as diretrizes de governança do ambiente corrente determinam forçar o estado estrito de 'PROPOSTO' devido à ausência de homologação prévia nesta execução."
    impact: "Bloqueia a promoção automática dos esquemas para o estado CANÔNICO ou VIGENTE e impede a execução não supervisionada de scripts SQL no banco de dados."
    resolution: "MANTIDO_ESTADO_PROPOSTO_E_STOP_GATE_FECHADO_CONFORME_DIRETRIZA_EXECUCAO_CORRENTE"
    decision_id: null
    evidence_ref_ids:
      - "EVID_HISTORICAL_BASELINE_STOP_GATE"

  - id: "CONF_FHERJ_ART25_VS_SGATE0023"
    status: "SUBSTITUICAO_DEMONSTRADA"
    subject_id: "CARIOCA_2026_STAGE_POINT_AWARDS"
    source_ids:
      - "SRC_REGULAMENTO_FHERJ_2026"
      - "SRC_CEPRAEA_DATABASE"
      - "SRC_MODELO_CONCEITUAL_04A"
    description: "O texto impresso do Art. 25º do Regulamento FHERJ diverge da tabela de pontuação de etapas efetivamente homologada para 2026 (1º ao 7º lugar: 16, 13, 11, 10, 9, 8 e 7 pontos) e da regra de exceção para equipes convidadas (SGATE-0024)."
    impact: "A regra do Art. 25º foi declarada STALE_FOR_SCORING. A atribuição de pontos para equipes classificadas do 8º lugar em diante não pode ser calculada por extrapolação, e equipes convidadas como Campinas/SP devem ser tratadas via elegibilidade no ranking final."
    resolution: "Adotada formalmente a tabela do SGATE-0023 para os lugares de 1 a 7; colocações 8+ são mantidas no estado INDETERMINATE até confirmação por boletim oficial; Campinas/SP é mantida no circuito acumulado mas excluída da classificação final conforme SGATE-0024."
    decision_id: "SGATE-0023"
    evidence_ref_ids:
      - "EVID_FHERJ_STALE_SCORING_RULE"
      - "EVID_SGATE_0024_CAMPINAS_EXCEPTION"

