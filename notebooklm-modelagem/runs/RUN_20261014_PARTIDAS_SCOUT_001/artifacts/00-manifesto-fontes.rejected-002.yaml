    description: "Regulamentos gerais e específicos da Confederação Brasileira de Handebol (CBHb)."
  - level: 3
    category: "REGULAMENTO_REGIONAL"
    description: "Regulamentos gerais e boletins da Federação de Handebol do Estado do Rio de Janeiro (FHERJ)."
  - level: 4
    category: "TRADUCAO_NORMATIVA"
    description: "Traduções em português das regras oficiais IHF (subordinadas ao texto original em inglês)."
  - level: 5
    category: "DIDATICO_TECNICO_IHF"
    description: "Apresentações didáticas, seminários da IHF Virtual Academy e guias de arbitragem."
  - level: 6
    category: "INSTRUMENTO_OPERACIONAL"
    description: "Bancos de dados operacionais (CEPRAEA DATABASE) e protocolos de scout de campo."
  - level: 7
    category: "SUPORTE_ACADEMICO_TECNICO"
    description: "Estudos acadêmicos, artigos de análise tática e artigos científicos do handebol de praia."
  - level: 8
    category: "PROPOSTA_HISTORICA_ARQUITETURA"
    description: "Modelos conceituais, lógicos, dicionários de dados, esquemas SQL e RLS do histórico do projeto."
  - level: 9
    category: "CONTROLE_DE_EXECUCAO"
    description: "Instruções de notebook, contratos de artefatos e templates de governança da execução."

included_scope:
  - "Regras da partida"
