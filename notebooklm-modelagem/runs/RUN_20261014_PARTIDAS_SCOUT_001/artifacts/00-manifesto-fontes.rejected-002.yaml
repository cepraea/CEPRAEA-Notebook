  - "Mídia institucional e assessoria de imprensa"
  - "Infraestrutura e logística não diretamente necessárias ao scout e à análise tática"

semantic_entities:
  - entity_id: "ONE_POINT_GOAL"
    description: >-
      Golo simples de 1 ponto concedido após finalização regular efetuada por jogador de linha sem rotação (spin)
      ou recepção em suspensão (in-flight), golo contra efetuado por qualquer atleta (Regra 12:2) ou arremesso
      espetacular executado sem o domínio ou a rotação técnica regulamentar exigida.
    evidence_ref_ids:
      - "d7ebb4e2-04f1-43f8-b2a0-152b98e5a226"
      - "236e788c-9c85-4133-93c8-4650a26e867a"
      - "f68c1687-7153-4283-a6a0-5e33b814fe00"
    detailed_location: "IHF Rule 9:1, Rule 12:2; Presentation Slides 5-8"

  - entity_id: "SPIN_SHOT_TWO_POINTS"
    description: >-
      Finalização espetacular de 2 pontos efetuada com rotação corporal completa de 360 graus no ar. O critério técnico
      exige rigorosamente que os pés do atleta no momento do salto/impulsão estejam direcionados frontalmente para
      a baliza adversária. Rotações incompletas (menores que 360 graus) são invalidadas para 1 ponto.
    evidence_ref_ids:
      - "f68c1687-7153-4283-a6a0-5e33b814fe00"
      - "d7ebb4e2-04f1-43f8-b2a0-152b98e5a226"
      - "236e788c-9c85-4133-93c8-4650a26e867a"
    detailed_location: "Presentation Slides 11-35; IHF Rule 9:2"

  - entity_id: "IN_FLIGHT_SHOT_TWO_POINTS"
    description: >-
      Finalização espetacular de 2 pontos (aéreo/in-flight) realizada em suspensão, onde o atleta domina a bola no ar
      e efetua o arremesso à baliza antes de tocar o solo. Ações de apenas empurrar ou dar uma palmada na bola no ar
      (slapping/pushing) valem apenas 1 ponto.
    evidence_ref_ids:
      - "f68c1687-7153-4283-a6a0-5e33b814fe00"
      - "d7ebb4e2-04f1-43f8-b2a0-152b98e5a226"
      - "236e788c-9c85-4133-93c8-4650a26e867a"
    detailed_location: "Presentation Slides 36-43; IHF Rule 9:2"

  - entity_id: "SIX_METRE_THROW"
    description: >-
      Tiro livre direto da linha de 6 metros concedido quando uma clara chance de golo é destruída ilicitamente em
      qualquer local da quadra por um adversário/oficial, por apito indevido ou interferência externa. O golo resultante
      é sempre recompensado com 2 pontos. O arremessador possui 3 segundos após o apito e não pode tocar a linha de 6m.
    evidence_ref_ids:
      - "d7ebb4e2-04f1-43f8-b2a0-152b98e5a226"
      - "236e788c-9c85-4133-93c8-4650a26e867a"
      - "049d2bf2-ac90-44f8-951a-ae9a32c0cc64"
      - "f68c1687-7153-4283-a6a0-5e33b814fe00"
    detailed_location: "IHF Rule 14; Presentation Slides 4-12 (6m throw + punishments); Presentation Slide 45"

  - entity_id: "GOALKEEPER_SPECIALIST_GOAL_TWO_POINTS"
    description: >-
      Golo marcado por goleira ou especialista (atleta usando camisa de cor diferenciada), recompensado com 2 pontos
      em qualquer modalidade técnica de arremesso, seja cobrando diretamente da sua área de golo ou em ataque posicionado.
    evidence_ref_ids:
      - "f68c1687-7153-4283-a6a0-5e33b814fe00"
      - "d7ebb4e2-04f1-43f8-b2a0-152b98e5a226"
      - "236e788c-9c85-4133-93c8-4650a26e867a"
    detailed_location: "Presentation Slides 49-51; IHF Rule 9:2"

  - entity_id: "SHOOT_OUT"
    description: >-
      Fase de desempate individual do jogo de handebol de praia, executada via duelo 1 contra a goleira em caso de
      empate em sets (1x1). Envolve passe da atleta para sua goleira e corrida para receber o contra-ataque e finalizar.
    evidence_ref_ids:
      - "d7ebb4e2-04f1-43f8-b2a0-152b98e5a226"
      - "f68c1687-7153-4283-a6a0-5e33b814fe00"
      - "36d92b57-69c1-4563-a2a4-71a7bd357dc7"
      - "569f2d66-ba38-41fc-aa84-d854bb6d0df9"
    detailed_location: "IHF Rule 9:3; CEPRAEA DB_JOGOS (shootout_cepraea/shootout_adversario)"

  - entity_id: "BALL_POSSESSION"
    description: >-
      Unidade estrutural de controle contínuo da bola por uma das equipes durante a partida. Inicia com a recuperação,
      tiro de golo ou tiro de sada e encerra por finalização, perda de bola, falta atacante ou término do segmento.
      Possui relação 1:N com Blocos de Organização Tática (BOU).
    evidence_ref_ids:
      - "c30b6966-654c-4682-84d5-41b0d15febb0"
      - "569f2d66-ba38-41fc-aa84-d854bb6d0df9"
    detailed_location: "05-schema-postgresql.sql Table public.possessions; CEPRAEA DB_JOGOS"

  - entity_id: "POSSESSION_START"
    description: >-
      Evento de início da posse de bola catalogado pelo scout observacional, caracterizado pelo tipo de origem
      (ex.: tiro de golo, roubo de bola, rebote, tiro livre) e delimitado por marcação temporal de vídeo (start_timecode).
    evidence_ref_ids:
      - "c30b6966-654c-4682-84d5-41b0d15febb0"
      - "569f2d66-ba38-41fc-aa84-d854bb6d0df9"
    detailed_location: "05-schema-postgresql.sql Table public.possessions (origin_type, start_timecode)"

  - entity_id: "BOU_BASIC_TACTICAL_UNIT"
    description: >-
      Bloco de Organização de Unidade Tática (BOU) pertencente a uma posse de bola (`possessions.id`). Delimita a
      estabilidade das estruturas ofensiva e defensiva e contém 1..N procedimentos táticos (`tactical_events`) ou
      uma finalização (`finalizations`).
    evidence_ref_ids:
      - "c30b6966-654c-4682-84d5-41b0d15febb0"
      - "569f2d66-ba38-41fc-aa84-d854bb6d0df9"
    detailed_location: "05-schema-postgresql.sql Table public.bous (possession_id, offensive_structure, initial_defensive_structure, final_defensive_structure)"

  - entity_id: "TACTICAL_EVENT"
    description: >-
      Procedimento tático coletivo ou individual registrado no scout observacional durante um BOU (`bous.id`), como
      passagem, engajamento, fixação, cruzamento, bloqueio, desmarcação ou circulação de especialista.
    evidence_ref_ids:
      - "c30b6966-654c-4682-84d5-41b0d15febb0"
      - "162256e7-41bf-40ac-b77f-7b892250771f"
      - "a44eece7-56e3-407c-9348-23b35ab0efa4"
    detailed_location: "05-schema-postgresql.sql Table public.tactical_events; Protocolo de Scout"

  - entity_id: "FINALIZATION"
    description: >-
      Ação técnica de arremesso direcionada à baliza ao término ou durante um BOU. Registra atleta finalizador, zona de
      origem, zona de alvo, tipo técnico (spin, in-flight, especialista, simples, 6m), resultado (golo, defesa, fora, trave)
      e pontuação atribuída (0, 1 ou 2 pontos).
    evidence_ref_ids:
      - "c30b6966-654c-4682-84d5-41b0d15febb0"
      - "605ea05f-b931-405d-984f-4773065aa6c8"
    detailed_location: "05-schema-postgresql.sql Table public.finalizations (origin_zone, target_zone, finalization_type, result, points_awarded)"

  - entity_id: "COURT_ZONE_LOCATION"
    description: >-
      Mapeamento e codificação espacial do terreno de jogo de areia (zonas de origem de arremesso e zonas de alvo na
      baliza) utilizado no scout tático observacional para análise de eficácia de finalização e setorização defensiva.
    evidence_ref_ids:
      - "c30b6966-654c-4682-84d5-41b0d15febb0"
      - "a44eece7-56e3-407c-9348-23b35ab0efa4"
    detailed_location: "05-schema-postgresql.sql Table public.finalizations (origin_zone, target_zone); Protocolo de Scout"

  - entity_id: "GOALKEEPER_SAVE"
    description: >-
      Ação defensiva da goleira vinculada a uma finalização adversária (`finalizations.id`). Registra o tipo de ação
      defensiva, saída de profundidade e ação subsequente (recuperação de bola, passe de contra-ataque/shoot-out).
    evidence_ref_ids:
      - "c30b6966-654c-4682-84d5-41b0d15febb0"
      - "a3068def-bef6-49bd-b063-c8593116298f"
      - "9b742f2e-0d21-4fb1-bca9-33411d6c6ec2"
    detailed_location: "05-schema-postgresql.sql Table public.goalkeeper_actions (defensive_action, forward_depth, subsequent_action)"

  - entity_id: "DEFENSIVE_STRUCTURE"
    description: >-
      Organização e desenho tático da fase defensiva registrado no BOU (`initial_defensive_structure` e
      `final_defensive_structure`), abrangendo os sistemas canônicos 3:0 (base, solta, cobertura) e 2:1 (coberturas, avançada).
    evidence_ref_ids:
      - "c30b6966-654c-4682-84d5-41b0d15febb0"
      - "de6241bc-cad8-42a5-80db-015ef2c1a780"
      - "d8076ca2-b651-48af-be4e-b14dd524c377"
