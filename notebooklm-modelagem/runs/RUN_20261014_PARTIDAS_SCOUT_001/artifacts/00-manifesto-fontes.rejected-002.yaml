classification_rules:
  execution_controls:
    description: >-
      As fontes CTRL são classificadas estritamente como ferramentas de governança, instrução de pipeline e
      controle de execução, sem valor declarativo ou factual para evidência esportiva.
  normative_precedence:
    description: >-
      As regras oficiais publicadas pela IHF (em inglês), suas atualizações e esclarecimentos oficiais, bem como os
      regulamentos vigentes das entidades organizadoras (CBHb e FHERJ), possuem a mais alta precedência normative.
  translation_governance:
    description: >-
      Traduções em língua portuguesa representam apoio operacional e não superam nem alteram o texto oficial em
      inglês da IHF em caso de divergência conceitual.
  operational_tools:
    description: >-
      O Protocolo de Scout e a base CEPRAEA DATABASE constituem instrumentos operacionais de trabalho e registros de
      campo, não configurando normas oficiais do esporte.
  technical_support:
    description: >-
      Artigos científicos, estudos acadêmicos e apresentações técnicas da IHF servem como material analítico de suporte.
  historical_proposals:
    description: >-
      Os 8 artefatos finais da arquitetura de dados (04A, 04B, 04C, catálogo de invariantes, matriz de cardinalidades,
      05-schema SQL, 06-migrations e 07-matriz RBAC/RLS) são classificados formalmente como propostas históricas da
      arquitetura e não comprovam implementação física corrente, teste efetuado ou aprovação ativa.

precedence_hierarchy:
  - level: 1
    category: "NORMA_OFICIAL_INTERNACIONAL"
    description: "Regras oficiais IHF em inglês, atualizações e esclarecimentos oficiais de jogo."
  - level: 2
