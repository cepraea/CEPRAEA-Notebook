- id: EQUIPE
  preferred_term: Equipe de Handebol de Praia
  canonical_name: Beach Handball Team
  classification: ENTITY
  definition: Coletivo esportivo composto por até 10 atletas inscritos por partida (com o mínimo de 6 para início de jogo)
    e até 4 oficiais/dirigentes de comissão técnica.
  valid_context:
  - Inscrições oficiais em súmula, partidas e circuitos estaduais/nacionais.
  invalid_context:
  - Atletas avulsos sem vínculo de inscrição ou equipes de modalidades indoor.
  inclusions:
  - Atletas de linha
  - Goleiros/Especialistas
  - Oficiais de comissão técnica (máximo 4 em súmula, 2 na área de substituição)
  exclusions:
  - Torcedores
  - Pessoas não inscritas na súmula oficial
  synonyms:
  - Time
  - Clube
  related_concept_ids:
  - ATLETA
  - PARTIDA
  allowed_values: []
  temporality: PERMANENTE
  privacy_classification: PUBLICO
  status: PROPOSTO
  evidence_ref_ids:
