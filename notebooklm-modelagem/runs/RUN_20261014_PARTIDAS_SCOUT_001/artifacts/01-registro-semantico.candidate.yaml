rules:
- id: RN_IHF_VIGENCIA_2026
  name: Vigência das Atualizações das Regras IHF 2026
  rule_type: TEMPORAL
  subject_ids:
  - PARTIDA
  statement: As alterações atualizadas das Regras de Jogo do Handebol de Praia da IHF entram em vigor oficialmente em 1º de
    abril de 2026 (ou 1º de julho de 2026 para disposições específicas de uniformes).
  conditions:
  - Partidas disputadas sob a égide da IHF/CBHb a partir de 01/04/2026.
  exceptions:
  - Regulamentos estaduais ou edições anteriores com salvaguarda explícita de transição.
  valid_from: '2026-04-01'
  valid_to: null
  valid_context:
  - Competições oficiais de Handebol de Praia.
  invalid_context:
  - Competições encerradas antes de 01/04/2026.
  implementation_targets:
  - motor_regras_ihf
  - validacao_partidas
  verification_test_ids:
  - TEST_REG_IHF_VIGENCIA_001
  status: PROPOSTO
  evidence_ref_ids:
  - EVID_IHF_RULES_2026_EN_001
  - EVID_ATUALIZACOES_IHF_2026_MD_02D99F75_002
- id: RN_SGATE_0023_PONTUACAO_FHERJ_2026
  name: Tabela Válida de Pontuação da FHERJ 2026
  rule_type: CALCULATION
  subject_ids:
  - EQUIPE
  - PARTIDA
  statement: A atribuição de pontos por colocação no Circuito FHERJ 2026 é estritamente dada pelas posições 1ª a 7ª ({1ª:16,
    2ª:13, 3ª:11, 4ª:10, 5ª:9, 6ª:8, 7ª:7}), retornando INDETERMINATE para a 8ª posição em diante.
  conditions:
  - Cálculo de pontuação do ranking do Circuito FHERJ 2026.
  exceptions:
  - Equipes inelegíveis por exceções contextuais regulamentares.
  valid_from: '2026-01-01'
  valid_to: '2026-12-31'
  valid_context:
  - Classificação das etapas do Circuito FHERJ 2026.
  invalid_context:
  - Inferência não auditada de pontos a partir da 8ª posição.
  implementation_targets:
  - service_ranking_fherj
  verification_test_ids:
  - TEST_SGATE_0023_SCORING
  status: PROPOSTO
  evidence_ref_ids:
  - EVID_CATALOGO_REGRAS_INVARIANTES_MD_3A0566A7_027
  - EVID_SOURCE_04A_MODELO_CONCEITUAL_MD_D7C900D7_006
- id: RN_SEMANTICA_GOLEIRA
  name: Regra de Governança Semântica da Goleira
  rule_type: CLASSIFICATION
  subject_ids:
  - GOLEIRA_POSICAO
  - ACAO_DA_GOLEIRA
  statement: GOLEIRA é categoricamente uma posição e pertence taxiologicamente à função DEFESA, sendo proibida a sua reclassificação
    como uma função tática isolada ou separada no sistema.
  conditions:
  - Sempre que for atribuída a posição GOLEIRA a uma atleta
  exceptions: []
  valid_context:
  - Modelagem conceitual, lógica e cadastro tático de atletas
  invalid_context:
  - Criação de taxonomias legadas desalinhadas com a decisão humana de governança
  implementation_targets:
  - Modelo Conceitual
  - Modelo Lógico
  - Dicionário de Dados
  verification_test_ids:
  - TEST_SEMANTICS_GOALKEEPER_ROLE
  evidence_ref_ids:
  - EVID_CEPRAEA_DATABASE_CCB2A718_004
  - EVID_SOURCE_04A_MODELO_CONCEITUAL_MD_D7C900D7_007
  valid_from: '2026-08-10'
  valid_to: null
  status: PROPOSTO
- id: RN_TETO_PARTICIPANTES_SUMULA
  name: Regra do Teto de Participantes por Súmula
  rule_type: OBLIGATION
  subject_ids:
  - PARTIDA
  - ATLETA
  - PAPEL_ESPORTIVO_OPERACIONAL
  statement: Cada equipe pode relacionar na súmula individual de jogo no máximo 10 atletas e 4 dirigentes, sendo permitido
    no máximo 4 atletas simultâneas na quadra de jogo (3 de linha e 1 goleira).
  conditions:
  - No momento da emissão da súmula de partida e início do jogo
  exceptions: []
  valid_context:
  - Validação de escalação e registros oficiais de partida
  invalid_context:
  - Lista larga de inscrição do campeonato (até 18 ou 20 atletas)
  implementation_targets:
  - Sistema de Registro de Partidas
  - Validação de Súmula
  verification_test_ids:
  - TEST_MATCH_ROSTER_LIMITS
  evidence_ref_ids:
  - EVID_REGULAMENTO_GERAL_CAMPEONATO_CARIOCA_DE_HANDEBOL_DE_PRAI_85DF0327_007
  - EVID_CATALOGO_REGRAS_INVARIANTES_MD_3A0566A7_024
  valid_from: '2026-03-01'
  valid_to: null
  status: PROPOSTO
- id: RN_REJEICAO_VARIAVEIS_INFERENCIAIS
  name: Regra de Rejeição de Variáveis Inferenciais na Codificação Primária
  rule_type: PROHIBITION
  subject_ids:
  - OBSERVACAO_DE_SCOUT
  - ACAO_OBSERVADA
  - PROVENIENCIA_OBSERVACAO
  statement: É proibido registrar na camada de observação primária (P1) variáveis que exijam julgamentos subjetivos ou inferências
    não sustentáveis exclusivamente pela mídia de vídeo.
  conditions:
  - Durante o processo de codificação primária de vídeo de scout
  exceptions: []
  valid_context:
  - Protocolo metodológico de scout e fichas de codificação P1
  invalid_context:
  - Análises subjetivas qualitativas de comissão técnica fora do banco de scout
  implementation_targets:
