- id: FASE_TATICA
  preferred_term: Fase Tática
  canonical_name: Tactical Phase (TAX-001)
  classification: CATALOG
  definition: Classificação do momento do jogo em uma das quatro fases ordinárias da modalidade (Transição Ofensiva - TO,
    Ataque Posicional - AP, Transição Defensiva - TD, Defesa Posicional - DP) ou fase indeterminável (F_IND).
  valid_context:
  - Codificação de scout, análise tática e categorização de vídeo.
  invalid_context:
  - Ações individuais fora da dinâmica coletiva do jogo.
  inclusions:
  - Transição Ofensiva (TO)
  - Ataque Posicional (AP)
  - Transição Defensiva (TD)
  - Defesa Posicional (DP)
  - Fase Indeterminável (F_IND)
  exclusions:
  - Paradas de jogo com bola fora de jogo (out of play)
  synonyms:
  - Fase de Jogo
  - Tactical Phase
  related_concept_ids:
  - POSSE_DE_BOLA
  - UNIDADE_BASICA_ATAQUE_BOU
  - SISTEMA_TATICO
  allowed_values:
