- id: POSSE_DE_BOLA
  preferred_term: Posse de Bola
  canonical_name: Ball Possession Unit (UNT-003)
  classification: EVENT
  definition: Intervalo temporal de direito, controle funcional ou legal da bola por uma equipe. Inicia pelo controle inequívoco
    da bola ou por reinício de jogo e termina por gol, perda do controle ou evento regulamentar.
  valid_context:
  - Análise tática e codificação observacional de scout.
  invalid_context:
  - Meros toques involuntários ou desvios na bola sem controle funcional.
  inclusions:
  - Posse de bola ativa em jogo vivo
  - Direito de retenção em reinício regulamentar
  exclusions:
  - Interrupções de jogo que mantêm a posse com a mesma equipe
  synonyms:
  - Posse
  - Possession Unit
  related_concept_ids:
