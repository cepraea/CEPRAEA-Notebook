  valid_from: '2026-08-26'
  valid_to: null
  status: PROPOSTO
- id: RN_PASSIVO_QUATRO_PASSES
  name: Regra do Limite de Passes no Jogo Passivo
  rule_type: CONDITION
  subject_ids:
  - FASE_OFENSIVA
  - ACAO_OBSERVADA
  statement: Exibido o sinal de advertência de jogo passivo pela arbitragem (Gesto nº 16), a equipe atacante dispõe de no
    máximo quatro passes para tentar um arremesso a gol antes que a posse seja revertida.
  conditions:
  - Sinalização de advertência de jogo passivo ativa pela arbitragem
  exceptions: []
  valid_context:
  - Regulamento oficial IHF 2026 e codificação de scout
  invalid_context:
  - Ataques normais sem sinalização de jogo passivo
  implementation_targets:
  - Motor de Regras de Jogo
  - Protocolo de Scout
  verification_test_ids:
