- id: GOLEIRA_POSICAO
  preferred_term: Posição de Goleira
  canonical_name: Goalkeeper Position
  classification: ROLE
  definition: Posição tática de atuação esportiva pertencente exclusivamente à função DEFESA. Não constitui uma função tática
    independente, sendo restrita à dimensão de posição tática de origem/atuação.
  valid_context:
  - Modelagem tática, escalações e estatísticas de jogo na fase defensiva.
  invalid_context:
  - Classificação da Goleira/Goleiro como Função Tática (TAX_FUNCTION) isolada.
  inclusions:
  - Atuação na área de gol sob o sistema defensivo
  exclusions:
  - Função tática isolada da taxonomia primária
  synonyms:
  - Goleiro
  - Guardiana
  - GK
  related_concept_ids:
  - ATLETA
  - POSSE_DE_BOLA
  - SISTEMA_TATICO
  allowed_values: []
  temporality: TEMPORAL
  privacy_classification: PUBLICO
