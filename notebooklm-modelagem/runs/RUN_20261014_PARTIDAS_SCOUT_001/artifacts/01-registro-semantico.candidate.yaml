- id: CARTAO_AZUL_SUSPENSAO
  preferred_term: Cartão Azul e Suspensão
  canonical_name: Blue Card Disqualification
  classification: EVENT
  definition: Desqualificação direta acompanhada de relatório por escrito da arbitragem, que acarreta suspensão automática
    mínima de 1 (uma) partida para o atleta ou oficial infrator.
  valid_context:
  - Infrações disciplinares de gravidade extrema em partidas oficiais.
  invalid_context:
  - Desqualificações ordinárias por acúmulo de duas exclusões.
  inclusions:
  - Exibição do Cartão Azul pela arbitragem
  - Registro em relatório oficial
  - Suspensão automática da partida subsequente
  exclusions:
  - Desqualificação sem relatório disciplinar
  synonyms:
  - Cartão Azul
  - Desqualificação com relatório
  related_concept_ids:
