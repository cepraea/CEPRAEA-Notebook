  - EVID_ATUALIZACOES_IHF_2026_MD_02D99F75_010
  valid_from: '2026-04-01'
  valid_to: null
  status: PROPOSTO
- id: RN_PROIBICAO_RETARDO_REPETIDO
  name: Regra de Proibição de Retardo Repetido do Reinício
  rule_type: PROHIBITION
  subject_ids:
  - PUNICAO_DISCIPLINAR
  - ACAO_OBSERVADA
  statement: É proibido a uma equipe retardar repetidamente a execução de tiros livres, tiros de lateral (throw-in) ou tiros
    de goleira (Rule 7:10), sob pena de sanção disciplinar e reversão de posse.
