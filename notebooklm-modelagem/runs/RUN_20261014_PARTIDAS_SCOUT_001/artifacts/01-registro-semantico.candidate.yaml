  - EVID_IHF_RULES_2026_EN_007
  - EVID_IHF_RULES_2026_EN_008
- id: SPIN_SHOT
  preferred_term: Spin Shot
  canonical_name: Spin Shot (360° Turn)
  classification: CATALOG
  definition: Técnica de arremesso valorizada em 2 pontos na qual o atleta realiza uma rotação completa do corpo (360°) no
    ar antes da liberação da bola, iniciando o salto com os pés direcionados ao gol.
  valid_context:
  - Ações de ataque posicional e finalizações.
  invalid_context:
  - Giros incompletos no solo ou sem fase aérea.
  inclusions:
  - Giro 360° completo suspenso no ar com arremesso a gol
  exclusions:
  - Semi-giro com apoio dos pés na areia durante o lançamento
  synonyms:
  - Arremesso com giro
  - Giro 360
  related_concept_ids:
  - GOL_DUPLO
  - IN_FLIGHT_SHOT
  allowed_values: []
  temporality: TEMPORAL
  privacy_classification: PUBLICO
  status: PROPOSTO
  evidence_ref_ids:
  - EVID_SOURCE_2_POINT_GOALS_SPIN_AND_IN_FLIGHT_SHOTS_MIN_PDF_923EFFD5_005
- id: IN_FLIGHT_SHOT
  preferred_term: In-flight Shot
  canonical_name: In-flight Shot (Fly)
  classification: CATALOG
  definition: Técnica de arremesso valorizada em 2 pontos na qual o atleta domina a bola enquanto está suspenso no ar (recebimento
    do passe) e efetua o arremesso ao gol antes de tocar o solo.
  valid_context:
  - Ações de ataque posicional, transições e finalizações.
  invalid_context:
  - Ações em que o atleta segura a bola e pisa na areia antes de arremessar.
  inclusions:
  - Recepção e arremesso sem qualquer contato do atleta com a areia durante a posse
  exclusions:
  - Tapas ou empurrões diretos na bola (que valem apenas 1 ponto)
  synonyms:
  - Ponte Aérea
  - Fly
  related_concept_ids:
  - GOL_DUPLO
  - SPIN_SHOT
  allowed_values: []
  temporality: TEMPORAL
  privacy_classification: PUBLICO
  status: PROPOSTO
  evidence_ref_ids:
  - EVID_IHF_RULES_2026_EN_014
  - EVID_SOURCE_2_POINT_GOALS_SPIN_AND_IN_FLIGHT_SHOTS_MIN_PDF_923EFFD5_006
- id: TIRO_SEIS_METROS
  preferred_term: Tiro de Seis Metros
  canonical_name: 6-Metre Throw
  classification: EVENT
  definition: Cobrança de arremesso direto concedida à equipe atacante quando uma clara ocasião de gol for destruída ilicitamente
    em qualquer parte da quadra por adversário ou oficial.
  valid_context:
  - Infrações graves que impedem oportunidade clara de gol.
  invalid_context:
  - Faltas ordinárias sem destruição de ocasião clara de gol.
  inclusions:
  - Arremesso executado em até 3 segundos a 1 metro da linha de 6m
  - Gols valendo 2 pontos se convertidos
  exclusions:
  - Tiro livre ordinário
  synonyms:
  - Tiro de 6m
  - Penalidade máxima
  related_concept_ids:
  - GOL_DUPLO
  - DESQUALIFICACAO_SEGUNDA_EXCLUSAO
  allowed_values: []
  temporality: TEMPORAL
  privacy_classification: PUBLICO
  status: PROPOSTO
