- id: PERIODO_SET
  preferred_term: Período / Set
  canonical_name: Match Period / Set
  classification: EVENT
  definition: Unidade temporal de jogo de duração exata de 10 minutos corridos, pontuada de forma totalmente independente
    em relação aos demais períodos da partida.
  valid_context:
  - Cronometragem e contagem de placar de partidas oficiais.
  invalid_context:
  - Tempos contínuos cumulativos sem pontuação zerada entre etapas.
  inclusions:
  - Primeiro Período (Set 1)
  - Segundo Período (Set 2)
  exclusions:
  - Intervalo de 5 minutos entre períodos
  synonyms:
  - Set
  - Tempo regulamentar
  related_concept_ids:
  - PARTIDA
  - GOL_DE_OURO
  allowed_values:
  - SET_1
  - SET_2
  temporality: TEMPORAL
  privacy_classification: PUBLICO
  status: PROPOSTO
  evidence_ref_ids:
  - EVID_IHF_RULES_2026_EN_002
  - EVID_REGRAS_DE_HANDEBOL_DE_PRAIA_2026_TRADUCAO_29_DE_MAIO_DE__92E1E487_003
- id: GOL_DE_OURO
  preferred_term: Gol de Ouro
  canonical_name: Golden Goal
  classification: RULE
  definition: Mecanismo de desempate applied imediatamente quando um período de 10 minutos termina empatado, declarando-se
    vencedora do período a primeira equipe que marcar um gol.
  valid_context:
  - Encerramento de períodos regulamentares empatados.
  invalid_context:
  - Desempate do resultado final de partidas empatadas em sets (1x1).
  inclusions:
  - Reinício por bola ao alto (tiro de árbitro) para início do Gol de Ouro
  exclusions:
  - Prorrogação por tempo fixo
  synonyms:
  - Golden Goal
  related_concept_ids:
  - PERIODO_SET
  - PARTIDA
  allowed_values: []
  temporality: EVENTUAL
  privacy_classification: PUBLICO
  status: PROPOSTO
  evidence_ref_ids:
