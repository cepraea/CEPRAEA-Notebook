  - EVID_IHF_RULES_2026_EN_011
  - EVID_SOURCE_6_METRE_THROW_PUNISHMENTS_PDF_D2567ACD_002
- id: EXCLUSAO_DISCIPLINAR
  preferred_term: Exclusão Disciplinar
  canonical_name: Suspension / Exclusion
  classification: EVENT
  definition: Penalização disciplinar temporária aplicada a um atleta por infrações às regras, obrigando a equipe a atuar
    em inferioridade numérica até a mudança de posse de bola.
  valid_context:
  - Sanções disciplinares em quadra.
  invalid_context:
  - Advertências verbais sem penalização de saída de quadra.
  inclusions:
  - Saída imediata do atleta da quadra até a troca de posse
  exclusions:
  - Desqualificação direta com cartão vermelho
  synonyms:
  - Exclusão temporária
  - Suspension
  related_concept_ids:
  - DESQUALIFICACAO_SEGUNDA_EXCLUSAO
