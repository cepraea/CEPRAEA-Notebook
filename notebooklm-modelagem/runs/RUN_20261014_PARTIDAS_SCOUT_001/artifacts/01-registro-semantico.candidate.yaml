  - EVID_REGRAS_DE_HANDEBOL_DE_PRAIA_2026_TRADUCAO_29_DE_MAIO_DE__92E1E487_007
- id: ATLETA
  preferred_term: Atleta
  canonical_name: Beach Handball Athlete
  classification: ENTITY
  definition: Pessoa física devidamente cadastrada e elegível para competir por uma equipe no domínio de Handebol de Praia,
    identificada por um ID canônico único.
  valid_context:
  - Sistemas de cadastro, convocações, atribuições táticas e scouts de jogo.
  invalid_context:
  - Membros exclusivamente administrativos ou comissão técnica sem registro de atleta.
  inclusions:
  - Atletas federadas/confederadas ativas em cadastro
  exclusions:
  - Membros da comissão técnica
  - Oficiais de arbitragem
  synonyms:
  - Jogadora
  - Jogador
  related_concept_ids:
  - EQUIPE
  - GOLEIRA_POSICAO
  allowed_values: []
  temporality: PERMANENTE
  privacy_classification: PESSOAL
  status: PROPOSTO
  evidence_ref_ids:
