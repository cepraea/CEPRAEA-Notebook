  - EVID_REGRAS_DE_HANDEBOL_DE_PRAIA_2026_TRADUCAO_29_DE_MAIO_DE__92E1E487_005
- id: SHOOT_OUT
  preferred_term: Shoot-out
  canonical_name: Shoot-out
  classification: EVENT
  definition: Série de desempate da partida utilizada quando cada equipe vence um período (1x1). Consiste em 5 arremessos
    alternados no formato '1 contra o Goleiro'.
  valid_context:
  - Decisão do vencedor da partida em empate de sets.
  invalid_context:
  - Desempate dentro de um único período regulamentar.
  inclusions:
  - Série inicial de 5 cobranças alternadas por equipe
  - Cobranças de morte súbita em caso de empate na primeira série
  exclusions:
  - Tiro livre direto após o apito final
  synonyms:
  - 1 contra o Goleiro
  - Disputa de Shoot-out
  related_concept_ids:
  - PARTIDA
  - PERIODO_SET
  allowed_values: []
  temporality: EVENTUAL
  privacy_classification: PUBLICO
  status: PROPOSTO
  evidence_ref_ids:
  - EVID_IHF_RULES_2026_EN_009
  - EVID_REGRAS_DE_HANDEBOL_DE_PRAIA_2026_TRADUCAO_29_DE_MAIO_DE__92E1E487_012
  - EVID_ESCLARECIMENTOS_REGRAS_DE_JOGO_PDF_067CB8EA_012
- id: GOL_SIMPLES
  preferred_term: Gol Simples
  canonical_name: One-Point Goal
  classification: EVENT
  definition: Finalização válida com conversão de pontuação regular equivalente a 1 (um) ponto, efetuada por jogador de linha
    sem uso de técnicas espetaculares ou situações especiais.
  valid_context:
  - Pontuação em partidas de Handebol de Praia.
  invalid_context:
  - Gols marcados por goleiro/especialista, giros 360°, pontes aéreas ou tiros de 6 metros.
  inclusions:
  - Arremesso convencional de jogador de linha
  - Tapas/empurrões na bola em jogadas aéreas
  - Gols contra efetuados por jogadores de linha
  exclusions:
  - Gols espetaculares de 2 pontos
  synonyms:
  - Gol de 1 Ponto
  - Regular Goal
  related_concept_ids:
  - GOL_DUPLO
  - PARTIDA
  allowed_values: []
  temporality: TEMPORAL
  privacy_classification: PUBLICO
  status: PROPOSTO
  evidence_ref_ids:
  - EVID_SOURCE_2_POINT_GOALS_SPIN_AND_IN_FLIGHT_SHOTS_MIN_PDF_923EFFD5_004
- id: GOL_DUPLO
  preferred_term: Gol Duplo
  canonical_name: Two-Point Goal
  classification: EVENT
  definition: Finalização válida com conversão de pontuação valorizada equivalente a 2 (dois) pontos, decorrente de técnicas
    criativas/espetaculares, arremesso de goleiro/especialista ou tiro de 6 metros.
  valid_context:
  - Pontuação em partidas de Handebol de Praia.
  invalid_context:
  - Arremessos simples de jogadores de linha.
  inclusions:
  - Spin Shot (giro 360°)
  - In-flight Shot (ponte aérea)
  - Gol marcado por goleira/goleiro ou especialista
  - Gol resultante de tiro de 6 metros
  exclusions:
  - Arremesso simples de quadra
  synonyms:
  - Gol de 2 Pontos
  - Creative Goal
  related_concept_ids:
  - GOL_SIMPLES
  - SPIN_SHOT
  - IN_FLIGHT_SHOT
  - TIRO_SEIS_METROS
  allowed_values: []
  temporality: TEMPORAL
  privacy_classification: PUBLICO
  status: PROPOSTO
  evidence_ref_ids:
