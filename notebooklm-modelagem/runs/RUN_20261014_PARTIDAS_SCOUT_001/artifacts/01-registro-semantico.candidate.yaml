- id: SISTEMA_TATICO
  preferred_term: Sistema Tático
  canonical_name: Tactical System
  classification: CATALOG
  definition: 'Disposição e organização espacial coletiva dos atletas na quadra para atuação na fase de ataque posicional
    (ex.: 3:1, 2:2, 4:0 em assimetria ofensiva com especialista) ou na fase defensiva (ex.: 3:0, 2:1, 1:2).'
  valid_context:
  - Análise tática coletiva de ataque posicional e organização defensiva.
  invalid_context:
  - Formações de modalidades indoor com 6 jogadoras de linha.
  inclusions:
  - Sistemas ofensivos em superioridade numérica 4x3 (3:1, 2:2, 4:0)
  - Sistemas defensivos (3:0, 2:1, 1:2)
  exclusions:
  - Atuações individuais sem coordenação com a estrutura coletiva
  synonyms:
  - Sistema Ofensivo
  - Sistema Defensivo
  - Formação Tática
  related_concept_ids:
