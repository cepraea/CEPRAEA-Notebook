- id: UNIDADE_BASICA_ATAQUE_BOU
  preferred_term: Unidade Básica de Ataque (BOU)
  canonical_name: Basic Attack Unit (BOU)
  classification: EVENT
  definition: Intervalo delimitado do ataque posicional que se inicia quando a equipe atacante apresenta organização estável
    em postos ofensivos diante de uma defesa organizada, encerrando-se na perda de posse ou interrupção tática.
  valid_context:
  - Análise tática de ataque posicional.
  invalid_context:
  - Fases de transição ofensiva rápida ou contra-ataque desorganizado.
  inclusions:
  - Ataque posicional 4x3 estruturado com especialista ou goleira
  exclusions:
  - Contra-ataque direto de área a área
  synonyms:
  - BOU
  - Basic Attack Unit
  related_concept_ids:
