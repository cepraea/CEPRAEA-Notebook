decisions:
- id: DEC_ON_GOLEIRA_SEMANTICS
  question: Qual a natureza ontológica e taxonômica do termo GOLEIRA no modelo de dados do CEPRAEA Beach Pro?
  alternatives:
  - Representar GOLEIRA como uma função tática (TAX_FUNCTION) primária ortogonal ao lado de Ataque e Defesa.
  - Representar GOLEIRA estritamente como uma Posição Tática (TAX_POSITION) vinculada à função DEFESA.
  selected_alternative: null
  rationale: O NotebookLM não possui autoridade para aprovar decisões ativas. O alinhamento semântico estabelece que a atuação
    no gol ocorre na fase defensiva, devendo ser modelada como Posição e não Função isolada.
  affected_ids:
  - GOLEIRA_POSICAO
  - SISTEMA_TATICO
  - ATLETA
  risk: Reintrodução incorreta do termo como função tática em relatórios de scout, gerando inconsistência nas agregações de
    estatísticas de ataque/defesa.
  evidence_ref_ids:
  - EVID_CEPRAEA_DATABASE_CCB2A718_004
  - EVID_SOURCE_04A_MODELO_CONCEITUAL_MD_D7C900D7_007
  status: EM_REVISAO
- id: DEC_ON_REJECTION_INFERENTIAL_VAR_28
  question: Devo manter a variável inferencial VAR-028 (troca_necessaria) na camada primária de observação de scout (P1)?
  alternatives:
  - Manter VAR-028 na ficha de codificação P1 sob julgamento do observador.
  - Excluir VAR-028 da camada P1 por falta de sustentação objetiva do vídeo e inviabilidade de verificação direta.
  selected_alternative: null
  rationale: O vídeo de broadcast não permite julgar com rigor objetivo a necessidade, correção ou atraso de uma troca tática
    sem pressuposições subjetivas do observador.
  affected_ids:
  - PROTOCOLO_SCOUT
  - EVENTO_SCOUT
  risk: Comprometimento da reprodutibilidade dos dados de scout e rebaixamento do índice de concordância entre observadores
    (Kappa de Cohen).
  evidence_ref_ids:
  - EVID_PROTOCOLO_DE_SCOUT_BEACH_HANDBALL_05F9B6E2_007
  status: EM_REVISAO
- id: DEC_ON_EXCECAO_CAMPINAS_FHERJ_2026
  question: Como modelar no banco de dados a inelegibilidade de pontuação do ranking final para a equipe de Campinas/SP no
    Circuito FHERJ 2026?
  alternatives:
  - Alterar a estrutura do objeto global TEAM e criar uma nova enumeração geral 'equipe_fora_do_estado'.
  - Tratar como uma instância contextual de FINAL_RANKING_ELIGIBILITY associada especificamente à participação da equipe na
    competição FHERJ 2026.
  selected_alternative: null
  rationale: A exceção é de natureza puramente regulamentar e contextual da competição regional, não devendo poluir a entidade
    canônica e imutável de Equipe.
  affected_ids:
  - EQUIPE
  - RN_SGATE_0023_PONTUACAO_FHERJ_2026
  risk: Rigidez na modelagem de equipes de fora do estado em outros campeonatos onde a pontuação seja permitida.
  evidence_ref_ids:
  - EVID_SOURCE_04B_MODELO_LOGICO_MD_FFCFA1B3_008
  status: EM_REVISAO
