concepts:
- id: PARTIDA
  preferred_term: Partida de Handebol de Praia
  canonical_name: Beach Handball Match
  classification: ENTITY
  definition: Confronto esportivo regulamentado composto por dois períodos (sets) independentes de 10 minutos cada, podendo
    incluir Gol de Ouro para desempate de período e Shoot-out para desempate da partida.
  valid_context:
  - Competições oficiais de Handebol de Praia e sistemas de registro de scout/partidas.
  invalid_context:
  - Treinos sem estrutura regulamentar ou modalidades de handebol de quadra/indoor.
  inclusions:
  - Períodos regulamentares (sets)
  - Prorrogação por Gol de Ouro
  - Disputa de Shoot-out
  exclusions:
  - Tempo extra continuado de 2x5 minutos típico do handebol de quadra
  synonyms:
  - Jogo
  - Match
  related_concept_ids:
  - PERIODO_SET
  - GOL_DE_OURO
  - SHOOT_OUT
  - EQUIPE
  allowed_values: []
