status: "PASS"
reviewed_at: "2026-10-14"
review_scope:
  - "ACCESS_CLASSIFICATION"
  - "PII_CLASSIFICATION"
  - "POSTGRESQL_TYPE_CANDIDATE"

type_replacements:
  - from: "varchar"
    to: "text"
    rationale: "VARCHAR sem limite não acrescenta restrição ao domínio; TEXT evita um tipo redundante e mantém o mesmo comportamento útil no PostgreSQL."
  - from: "timestamp with time zone"
    to: "timestamptz"
    rationale: "TIMESTAMPTZ é o alias canônico e conciso para instantes com fuso no PostgreSQL."

accepted_types:
  - type: "uuid"
    rationale: "Preserva os identificadores opacos do modelo lógico; a estratégia de geração ordenada permanece decisão da etapa física."
  - type: "integer"
    rationale: "Adequado às contagens, ordens e deslocamentos delimitados pelo domínio atual."
  - type: "boolean"
    rationale: "Representa estados binários sem codificação textual."
  - type: "text"
    rationale: "Adequado a texto aberto e códigos controlados por catálogo ou check."
  - type: "numeric"
    rationale: "Preserva aritmética decimal exata sem inventar precisão ou escala ausentes nas evidências."

