access_rationale:
  internal_scout: "Fatos de scout, recortes de vídeo e sistemas táticos permanecem internos por padrão; exposição pública deve ocorrer por recurso ou view autorizada em etapa posterior."
  operational_roles: "A relação de papéis contém nome de pessoa física e não pode permanecer pública por padrão."
  disciplinary_events: "Sanções vinculadas a atleta exigem acesso restrito até que uma política explícita delimite a divulgação oficial."

