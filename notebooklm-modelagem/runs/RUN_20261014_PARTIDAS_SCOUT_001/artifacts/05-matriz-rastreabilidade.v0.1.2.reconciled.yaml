open_issues:
  - id: "ISSUE_MODELAGEM_CONFIABILIDADE_OBSERVACAO"
    status: "ABERTA"
    question: "Como rastrear amostra, avaliadores, metodo e resultado da confiabilidade da observacao ate o modelo fisico e os testes?"
    affected_ids:
      - "TRACE_CONFIABILIDADE_OBSERVACAO"
      - "CONFIABILIDADE_OBSERVACAO"
      - "OBSERVACAO_DE_SCOUT"
      - "REVISAO_DA_OBSERVACAO"
    impact: "A exigencia do operador e a evidencia cientifica nao possuem mapeamento logico, fisico ou teste reproduzivel."
    required_evidence: "Decisao de modelagem da granularidade da avaliacao e nova versao dos artefatos 02-05."
    owner: "OPERADOR"
  - id: "ISSUE_LACUNA_PLACAR_SHOOTOUT_E_ETAPAS"
    status: "ABERTA"
    question: "Como completar a lacuna de documentação de placar detalhado de shoot-out em jogos específicos da Etapa Final\
      \ (ex.: J71) e parciais de sets da 4ª Etapa Estadual?"
    affected_ids:
      - "PLACAR_JOGO"
      - "EVOLUCAO_DO_PLACAR"
      - "PARTIDA"
      - "SHOOT_OUT"
    impact: "Incompletude no histórico cronológico e auditável do placar em partidas passadas específicas sem registro de\
      \ vídeo em arquivo."
    required_evidence: "Súmula física impressa assinada ou boletim impresso oficial expedido pela FHERJ/CBHb."
    owner: "OPERADOR"
  - id: "ISSUE_ENFORCEMENT_TETO_PARTICIPANTES_SUMULA"
    status: "ABERTA"
    question: "Como representar atletas e oficiais relacionados na súmula de uma partida para aplicar os limites de 10 e 4\
      \ por equipe?"
    affected_ids:
      - "PARTIDA_EQUIPE"
      - "PARTIDA"
      - "EQUIPE"
    impact: "O teto regulamentar não pode ser validado fielmente no schema físico atual."
    required_evidence: "Extensão aprovada do modelo com o elenco da súmula por partida e a categoria do participante."
    owner: "MODELISTA"
  - id: "ISSUE_ENFORCEMENT_PRAZO_INSCRICAO_72H"
    status: "ABERTA"
    question: "Qual partida ou prazo oficial deve ser associado a cada inscrição para validar a antecedência mínima de 72\
      \ horas?"
    affected_ids:
      - "EQUIPE_ATLETA_INSCRICAO"
      - "PARTIDA"
    impact: "A inscrição referencia a competição, mas não contém o marco temporal específico exigido pela regra."
    required_evidence: "Decisão de modelagem que vincule a inscrição ao prazo oficial aplicável ou à partida correspondente."
    owner: "MODELISTA"
  - id: "ISSUE_ENFORCEMENT_PASSIVO_QUATRO_PASSES"
    status: "ABERTA"
    question: "Como registrar o sinal de jogo passivo e a contagem de passes posteriores dentro da posse?"
    affected_ids:
      - "POSSE_DE_BOLA"
      - "EVENTO_SCOUT"
    impact: "Sem o sinal e a contagem observada, o limite de quatro passes não possui operandos físicos."
    required_evidence: "Extensão aprovada do protocolo e do modelo para sinal de passivo e passes subsequentes."
    owner: "MODELISTA"
