operator_decisions:
  - id: "DEC_RANKING_CONVIDADOS_FHERJ_2026"
    source: "USER_STATEMENT_2026_10_14"
    decision: "A participação esportiva e a elegibilidade para o ranking final são fatos independentes e contextuais à competição."
    confirmed_facts:
      - "Campinas participa do Campeonato Carioca desde 2025 e não conta para o ranking final."
      - "Chile participa de determinadas etapas e não conta para o ranking final."
      - "A participação sem pontuação final decorre de decisão dos clubes apoiada pela FHERJ."
    modeling_consequence: "Registrar a elegibilidade na participação equipe-competição, sem inferi-la por UF, país ou cadastro global da equipe."
  - id: "DEC_PLACAR_HISTORICO_INCOMPLETO"
    source: "OPERATOR_REVIEW_2026_10_14"
    decision: "Placar detalhado desconhecido deve permanecer nulo e possuir estado explícito de completude; zero não representa ausência de evidência."
    confirmed_facts: []
    modeling_consequence: "Permitir shoot-out confirmado com pontuação detalhada desconhecida, sem fabricar valores."

