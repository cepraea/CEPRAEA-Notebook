added_normalization_decisions:
  - id: "NORM_DECISION_006"
    affected_relation_ids:
      - "EQUIPE"
      - "COMPETICAO"
      - "PARTICIPACAO_EQUIPE_COMPETICAO"
    decision: "Separar participação esportiva de elegibilidade para o ranking final em uma relação temporal equipe-competição."
    rationale: "Campinas e Chile podem disputar etapas e partidas sem pontuar no ranking final; a decisão é contextual e não constitui propriedade permanente da equipe."
    accepted_tradeoffs:
      - "O serviço de ranking deve consultar a participação vigente antes de agregar pontos."
      - "A relação EQUIPE_PARTICIPA_COMPETICAO é um refinamento lógico aprovado que deverá ser reconciliado no próximo versionamento conceitual."

