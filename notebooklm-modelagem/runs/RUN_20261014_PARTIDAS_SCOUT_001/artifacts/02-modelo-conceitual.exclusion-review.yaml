status: "PASS"
reviewed_concept_ids:
  - "SPIN_SHOT"
  - "IN_FLIGHT_SHOT"
  - "DESQUALIFICACAO_SEGUNDA_EXCLUSAO"
  - "CARTAO_AZUL_SUSPENSAO"
  - "SISTEMA_TATICO"
  - "PAPEL_ESPORTIVO_OPERACIONAL"
decisions:
  - concept_id: "SPIN_SHOT"
    decision: "PROMOVER_COMO_EVENTO"
    rationale: "A taxonomia da técnica pode ser catalogar, mas cada execução observada possui instante, atleta, contexto e proveniência próprios."
  - concept_id: "IN_FLIGHT_SHOT"
    decision: "PROMOVER_COMO_EVENTO"
    rationale: "A taxonomia da técnica pode ser catalogar, mas cada execução observada possui instante, atleta, contexto e proveniência próprios."
  - concept_id: "DESQUALIFICACAO_SEGUNDA_EXCLUSAO"
    decision: "PROMOVER_COMO_EVENTO"
    rationale: "A desqualificação é consequência disciplinar verificável com ator, partida, instante e efeito próprio; não deve existir apenas como valor de atributo."
  - concept_id: "CARTAO_AZUL_SUSPENSAO"
    decision: "PROMOVER_COMO_EVENTO"
    rationale: "O cartão azul exige relatório e produz suspensão posterior, portanto possui identidade e efeitos além do evento genérico de scout."
  - concept_id: "SISTEMA_TATICO"
    decision: "PROMOVER_COMO_SNAPSHOT_VERSIONADO"
    rationale: "A configuração coletiva muda durante a partida e precisa preservar equipe, fase, intervalo de vigência e proveniência observacional."
  - concept_id: "PAPEL_ESPORTIVO_OPERACIONAL"
    decision: "PROMOVER_COMO_ATRIBUICAO_TEMPORAL"
    rationale: "O papel é atribuído a uma pessoa em uma partida e, quando aplicável, a uma equipe; o vínculo transitório é o fato modelado."

