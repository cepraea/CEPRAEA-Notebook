recommended_scope:
  - "Gerar candidatos físicos no STAGE_08 para as 32 relações lógicas do LOGICAL_MODEL v0.1.1; esta recomendação não autoriza implantação."
  - "Núcleo de competição e partida: COMPETICAO, PARTIDA, EQUIPE, ATLETA, PARTIDA_EQUIPE, EQUIPE_ATLETA_INSCRICAO, PERIODO_SET e SHOOT_OUT."
  - "Eventos e placar: POSSE_DE_BOLA, UNIDADE_BASICA_ATAQUE_BOU, EVENTO_SCOUT, PLACAR_JOGO, ESTADO_DO_PLACAR, EVOLUCAO_DO_PLACAR, SPIN_SHOT e IN_FLIGHT_SHOT."
  - "Scout e proveniência: OBSERVACAO_DE_SCOUT, ANALISTA_OBSERVADOR, PROTOCOLO_SCOUT, MIDIA_VIDEO, SEGMENTO_OBSERVADO, CONFIABILIDADE_OBSERVADOR, REVISAO_DA_OBSERVACAO, ESTADO_DE_REVISAO, PROVENIENCIA_OBSERVACAO e TRECHO_OBSERVADO."
  - "Tática, disciplina e participação: SISTEMA_DEFENSIVO, SISTEMA_TATICO, PAPEL_ESPORTIVO_OPERACIONAL, DESQUALIFICACAO_SEGUNDA_EXCLUSAO, CARTAO_AZUL_SUSPENSAO e PARTICIPACAO_EQUIPE_COMPETICAO."
excluded_scope:
  - "Implantação em produção, migration destrutiva ou alteração de fatos históricos."
  - "Autoconsulta do atleta até existir vínculo de identidade único, revogável e auditável."
  - "Exposição pela Data API dos 23 recursos classificados como INTERNO ou RESTRITO."
  - "Carga de placares detalhados de shoot-out e parciais históricas afetadas por ISSUE_LACUNA_PLACAR_SHOOTOUT_E_ETAPAS."
  - "Carga e planejamento de treinamento, saúde, gestão financeira ou administrativa e mídia institucional."
restrictions:
  - "A decisão humana pode autorizar somente a geração dos candidatos dos STAGE_08 a STAGE_13; execução ou implantação exigirá evidência e aprovação próprias."
  - "Não implementar UQ_TRECHO_EVENTO nem CHK_VIGENCIA_PARTICIPACAO citados no DATA_DICTIONARY v0.1.0; prevalecem LOGICAL_MODEL v0.1.1 e TRACEABILITY_MATRIX v0.1.0."
  - "Preservar zero a muitos TRECHO_OBSERVADO por EVENTO_SCOUT e usar CHK_INTERVALO_VIGENCIA_PARTICIPACAO somente para a validade interna da linha."
  - "Tratar a não sobreposição de vigência separadamente e validar btree_gist antes de propor EXCLUDE USING gist."
  - "Criar índices candidatos para as 59 FKs, além das colunas usadas por escopos RLS, e validar os planos de consulta na etapa física."
  - "Não inferir nem fabricar placares históricos ausentes; os registros afetados permanecem fora da carga."
  - "Atribuições de papel devem possuir vigência, responsável, auditoria e proibição de autoatribuição."
  - "A revisão de scout deve impedir que o analista autor revise a própria observação."
  - "Somente os 9 recursos PUBLICO podem ser candidatos à Data API; os demais 23 permanecem fechados até revisão explícita."
required_human_decisions:
  - "Aceitar, rejeitar ou alterar a recomendação READY_WITH_RESTRICTIONS e seu escopo de 32 relações."
  - "Se aceita, autorizar explicitamente o início do STAGE_08 apenas para geração do schema PostgreSQL candidato."
