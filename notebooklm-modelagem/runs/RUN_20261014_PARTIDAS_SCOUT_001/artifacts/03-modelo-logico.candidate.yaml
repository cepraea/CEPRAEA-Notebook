normalization_decisions:
  - id: "NORM_DECISION_001"
    affected_relation_ids:
      - "PARTIDA"
      - "PERIODO_SET"
      - "SHOOT_OUT"
      - "PLACAR_JOGO"
      - "ESTADO_DO_PLACAR"
      - "EVOLUCAO_DO_PLACAR"
    decision: "Isolamento estrito das estruturas de placar, sets, shoot-out e variação temporal da pontuação fora da tabela\
      \ PARTIDA."
    rationale: "Garantia da Terceira Forma Normal (3FN) e cumprimento dos comandos de não-agregação, permitindo auditoria\
      \ detalhada de cada período e alteração monotônica de pontuação."
    accepted_tradeoffs:
      - "Aumento na necessidade de Junções (JOINs) em consultas de alto nível para consolidação do resultado final da partida."
  - id: "NORM_DECISION_002"
    affected_relation_ids:
      - "ATLETA"
    decision: "Isolamento da semântica de Goleira em atributo posicional da relação ATLETA ao invés de entidade separada."
    rationale: "Alinhamento direto com a Regra de Governança Semântica RN_SEMANTICA_GOLEIRA, fixando que Goleira é uma posição\
      \ tática restrita à fase defensiva e não uma função isolada ou entidade separada."
    accepted_tradeoffs:
      - "Exigência de validações de integridade posicional em nível de aplicação/check constraints ao registrar formações\
        \ de quadra."
  - id: "NORM_DECISION_003"
    affected_relation_ids:
      - "EVENTO_SCOUT"
      - "SPIN_SHOT"
      - "IN_FLIGHT_SHOT"
      - "DESQUALIFICACAO_SEGUNDA_EXCLUSAO"
      - "CARTAO_AZUL_SUSPENSAO"
    decision: "Decomposição em BCNF dos eventos táticos e disciplinares especializados a partir da relação base EVENTO_SCOUT."
    rationale: "Preservação do grão atômico de eventos observacionais, evitando colunas esparsas ou nulas e isolando particularidades\
      \ técnicas (ex.: rotação 360°, ponte aérea, relatório escrito) em tabelas especializadas 1:1."
    accepted_tradeoffs:
      - "Multiplicação de tabelas de especialização e necessidade de consultas com junção condicional baseadas no tipo de\
        \ ação."
  - id: "NORM_DECISION_004"
    affected_relation_ids:
      - "OBSERVACAO_DE_SCOUT"
      - "REVISAO_DA_OBSERVACAO"
      - "ESTADO_DE_REVISAO"
      - "PROVENIENCIA_OBSERVACAO"
      - "CONFIABILIDADE_OBSERVADOR"
    decision: "Isolamento e normalização do ciclo de vida, revisões e proveniência epistemológica da observação de scout."
    rationale: "Garantia da imutabilidade da proveniência de dados (ferramenta, arquivo fonte e protocolo) e controle rigoroso\
      \ de qualidade e concordância inter-observador (índices Kappa)."
    accepted_tradeoffs:
      - "Aumento da complexidade da camada de governança e auditoria dos registros primários de scout."
  - id: "NORM_DECISION_005"
    affected_relation_ids:
      - "PARTIDA_EQUIPE"
      - "PAPEL_ESPORTIVO_OPERACIONAL"
    decision: "Normalização da comissão técnica, arbitragem e delegados na relação PAPEL_ESPORTIVO_OPERACIONAL com referência\
      \ opcional (nullable) para equipe."
    rationale: "Descouplamento estrutural entre papéis neutros da partida (arbitragem, mesa, delegados) e papéis vinculados\
      \ a clubes (técnicos, médicos), evitando polimorfismo ou tabelas esparsas e garantindo 3FN na gestão da súmula."
    accepted_tradeoffs:
      - "Necessidade de check constraints ou validação em nível de regra de negócio para assegurar que papéis de comissão\
        \ técnica tenham equipe_id preenchido e papéis neutros mantenham equipe_id nulo."
  - id: "NORM_DECISION_006"
    affected_relation_ids:
      - "EQUIPE"
      - "COMPETICAO"
      - "PARTICIPACAO_EQUIPE_COMPETICAO"
    decision: "Separar participação esportiva de elegibilidade para o ranking final em uma relação temporal equipe-competição."
    rationale: "Campinas e Chile podem disputar etapas e partidas sem pontuar no ranking final; a decisão é contextual e não\
      \ constitui propriedade permanente da equipe."
    accepted_tradeoffs:
      - "O serviço de ranking deve consultar a participação vigente antes de agregar pontos."
open_issues:
  - id: "ISSUE_LACUNA_PLACAR_SHOOTOUT_E_ETAPAS"
    status: "ABERTA"
    question: "Como completar a lacuna de documentação de placar detalhado de shoot-out em jogos específicos da Etapa Final\
      \ (ex.: J71) e parciais de sets da 4ª Etapa Estadual?"
    affected_ids:
      - "PLACAR_JOGO"
      - "EVOLUCAO_DO_PLACAR"
      - "PARTIDA"
      - "SHOOT_OUT"
    impact: "Incompletude no histórico cronológico e auditável do placar em partidas passadas específicas sem registro de\
      \ vídeo em arquivo."
    required_evidence: "Súmula física impressa assinada ou boletim impresso oficial expedido pela FHERJ/CBHb."
    owner: "OPERADOR"
